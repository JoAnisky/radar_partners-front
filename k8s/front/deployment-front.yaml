apiVersion: apps/v1
kind: Deployment
metadata:
    name: radar-front
spec:
    replicas: 1
    selector:
        matchLabels:
            app: radar-front
    template:
        metadata:
            labels:
                app: radar-front
        spec:
            containers:
                - name: app
                  image: joanisky/radarpartners-front:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 3000
                        name: http
                  envFrom:
                      - configMapRef:
                            name: radar-front-config
                  resources:
                      requests:
                          memory: "96Mi"
                          cpu: "50m"
                      limits:
                          memory: "256Mi"
                          cpu: "200m"
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
