apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: radar-front-ingress
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        traefik.ingress.kubernetes.io/router.middlewares: radarpartners-front-radar-noindex@kubernetescrd
spec:
    tls:
        - hosts:
              - radar.jonathanlore.fr
          secretName: radar-tls
    rules:
        - host: radar.jonathanlore.fr
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: radar-front
                            port:
                                number: 3000
